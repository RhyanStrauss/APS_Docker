services:
  api:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=tarefas_db
      - DB_USER=tarefas_user
      - DB_PASSWORD=tarefas_pass
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tarefas_db
      - POSTGRES_USER=tarefas_user
      - POSTGRES_PASSWORD=tarefas_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
